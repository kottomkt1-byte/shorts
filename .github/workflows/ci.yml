name: Verify editor
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run build:vercel
        env:
          SHORTS_BACKEND_ORIGIN: https://renderer.example
      # The actual PID-1, unprivileged container must also launch FFmpeg correctly.
      - run: docker build -t shorts-ci .
      - run: docker run --rm --user 10001 --entrypoint python -v "$PWD/tests:/app/tests:ro" shorts-ci -m unittest discover -s tests -v
